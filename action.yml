name: "pii-scan"
description: "Scan a CSV export for e-mail, phone, passport pairs and SNILS before it leaves the company"
author: "basovdanil"
branding:
  icon: "shield"
  color: "green"

inputs:
  file:
    description: "Path to the CSV file to scan"
    required: true
  delimiter:
    description: "Field delimiter (use ';' for exports from Excel and 1C)"
    required: false
    default: ","
  json:
    description: "Print the machine-readable report"
    required: false
    default: "false"
  fail-on-findings:
    description: "Fail the step when personal data is found (set to 'false' to only report)"
    required: false
    default: "true"

outputs:
  result:
    description: "Report text: per-column counts and masked examples"
    value: ${{ steps.scan.outputs.result }}
  has-findings:
    description: "yes when personal data was found, no when the file is clean"
    value: ${{ steps.scan.outputs.has-findings }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - id: scan
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        DELIMITER: ${{ inputs.delimiter }}
        AS_JSON: ${{ inputs.json }}
        FAIL: ${{ inputs.fail-on-findings }}
      run: |
        set +e
        args=(--delimiter "$DELIMITER")
        if [ "$AS_JSON" = "true" ]; then
          args+=(--json)
        fi
        output=$(python "$GITHUB_ACTION_PATH/pii_scan.py" "$FILE" "${args[@]}")
        status=$?
        set -e
        echo "$output"
        {
          echo "result<<EOF"
          echo "$output"
          echo "EOF"
          echo "has-findings=$([ "$status" -eq 4 ] && echo yes || echo no)"
        } >> "$GITHUB_OUTPUT"
        if [ "$FAIL" = "true" ] && [ "$status" -ne 0 ]; then
          exit $status
        fi
        exit 0
